name: Freerider watch


on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit seen.json

concurrency:
  group: freerider-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sites
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python watcher.py

      - name: Save seen trips
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name  "freerider-bot"
            git config user.email "freerider-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "seen: update"
            git push
          fi
